name: Android APK Build
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-builds.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-builds.yml'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install
      - name: Generate Android native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive
      - name: Align Kotlin with Compose compiler
        working-directory: apps/mobile/android
        run: |
          echo 'Kotlin version declarations before alignment:'
          grep -RIn '1\.9\.24' . --exclude-dir=.gradle --exclude-dir=build || true
          grep -RIl '1\.9\.24' . --exclude-dir=.gradle --exclude-dir=build | xargs -r sed -i 's/1\.9\.24/1.9.25/g'
          echo 'Kotlin version declarations after alignment:'
          grep -RIn '1\.9\.25' . --exclude-dir=.gradle --exclude-dir=build || true
      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: sounddesk-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
