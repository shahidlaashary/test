name: Android APK Build
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-builds.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-builds.yml'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install
      - name: Generate Android native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive
      - name: Align Kotlin with Compose compiler
        run: |
          echo 'Pinning Kotlin plugin declarations in generated Gradle files to 1.9.25'
          echo "android.kotlinVersion=1.9.25" >> apps/mobile/android/gradle.properties
          find apps/mobile/android -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -not -path '*/.gradle/*' -not -path '*/build/*' -print0 | xargs -0 -r sed -i 's/1\.9\.24/1.9.25/g'
          python3 - <<'PY'
          from pathlib import Path
          settings = Path("apps/mobile/android/settings.gradle")
          content = settings.read_text()
          marker = "pluginManagement {"
          rule = """pluginManagement {
              resolutionStrategy {
                  eachPlugin {
                      if (requested.id.id.startsWith("org.jetbrains.kotlin")) {
                          useVersion("1.9.25")
                      }
                  }
              }"""
          if marker not in content:
              raise SystemExit("Could not find pluginManagement block in settings.gradle")
          content = content.replace(marker, rule, 1)
          settings.write_text(content)
          print("Forced Kotlin Gradle plugins to 1.9.25 in settings.gradle")
          PY
          echo 'Verifying generated Gradle configuration:'
          grep -RInF '1.9.24' apps/mobile/android --include='*.gradle' --include='*.gradle.kts' --exclude-dir=.gradle --exclude-dir=build && exit 1 || true
          grep -RInF '1.9.25' apps/mobile/android --include='*.gradle' --include='*.gradle.kts' --exclude-dir=.gradle --exclude-dir=build || true
          echo 'Root Android Gradle build file:'
          sed -n '1,120p' apps/mobile/android/build.gradle
      - name: Build debug APK (retry transient Maven rate limits)
        working-directory: apps/mobile/android
        run: |
          for attempt in 1 2 3 4; do
            echo "APK build attempt ${attempt}/4"
            if ./gradlew -Pandroid.kotlinVersion=1.9.25 assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Gradle build failed; waiting 30 seconds before retry..."
              sleep 30
            fi
          done
          exit 1
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: sounddesk-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
