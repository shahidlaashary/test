name: Android APK Build
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-builds.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-builds.yml'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install
      - name: Generate Android native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive
      - name: Align Kotlin and Compose compiler versions
        working-directory: apps/mobile
        run: |
          echo "android.kotlinVersion=1.9.24" >> android/gradle.properties
          echo "Configured Kotlin 1.9.24 for Expo Modules Core Compose mapping"
          grep -n 'kotlinVersion' android/build.gradle
          grep -n 'android.kotlinVersion' android/gradle.properties
          grep -n -A8 'composeOptions' ../../node_modules/expo-modules-core/android/build.gradle
          grep -q '"1.9.24": "1.5.14"' ../../node_modules/expo-modules-core/android/build.gradle
      - name: Build debug APK (retry transient Maven rate limits)
        working-directory: apps/mobile/android
        run: |
          for attempt in 1 2 3 4; do
            echo "APK build attempt ${attempt}/4"
            if ./gradlew assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Gradle build failed; waiting 30 seconds before retry..."
              sleep 30
            fi
          done
          exit 1
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: sounddesk-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
