name: Runner Isolation Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  runner-test:
    runs-on: ubuntu-latest
    steps:
      - name: Runner start marker
        run: echo "RUNNER_TEST_STARTED"
      - name: Show OS
        run: cat /etc/os-release
      - name: Show Python
        run: python3 --version
      - name: Show runner context
        run: |
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
